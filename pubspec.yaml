name: dicume_app
description: "App educacional nutricional para pessoas com diabetes tipo 2 em Imperatriz-MA"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Core Dependencies
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  # Local Database & Cache
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.1
  path: ^1.9.0

  # HTTP & Network
  dio: ^5.9.2
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.1.1
  # Authentication & Security
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.3.0
  jwt_decoder: ^2.0.1

  # UI & Animations
  lottie: ^3.3.3
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  go_router: ^17.2.3

  # Feedback Tátil e Sonoro
  vibration: ^3.1.8
  audioplayers: ^6.6.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.8
  json_annotation: ^4.12.0
  dartz: ^0.10.1

  # Fonts
  google_fonts: ^8.1.0

  # Icons
  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter Launcher Icons
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  riverpod_generator: ^4.0.4-dev.1
  build_runner: ^2.4.14
  drift_dev: ^2.33.0
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.4

  # Linting
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  android_adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  android_adaptive_icon_background: "#6D4C41"

flutter:
  uses-material-design: true
  # Assets
  assets:
    - assets/icons/
    - assets/lottie/

